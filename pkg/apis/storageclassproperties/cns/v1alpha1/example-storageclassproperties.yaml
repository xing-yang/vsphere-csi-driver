---
# Example 3: vSAN File Services (RWX Support)
apiVersion: cns.vmware.com/v1alpha1
kind: StorageClassProperties
metadata:
  name: vsan-file-services-sc
spec:
  kind: StorageClass
  storageClassName: vsan-file-services-sc
  storagePolicyID: "cc8e7c94-3e00-67fc-97f5-5f96d93c7def"
status:
  # Storage Type Information
  storageTypeInfo:
    datastoreType: vsan
    vsanArchitecture: ESA
    vsanVersion: "9.1"

  # Volume Type Information - Multi-node access only
  volumeTypeInfo:
    supportedAccessModes:
      - ReadWriteMany      # MULTI_NODE_MULTI_WRITER
      - ReadOnlyMany       # MULTI_NODE_READER_ONLY
      # Note: ReadWriteOnce (SINGLE_NODE_WRITER) is NOT supported for file volumes
    supportedVolumeModes:
      - filesystem         # File volumes only, no block support
    fileSystemTypes:
      - nfs4               # vSAN File Services uses NFS protocol
      - nfs
    blockSupport: false    # vSAN File Services does not support block volumes

  # Topology Information
  topologyInfo:
    topologyType: zonal
    accessibleZones:
      - zone-1
    backingZones:
      - zone-1
    # Note: vSAN File Services does NOT support stretched/cross-zonal clusters
    # unless Workload Domain Isolation feature is enabled

  # Encryption Information
  encryptionInfo:
    supported: true
    types:
      - vsan-encryption
    requiresKeyProvider: true

  # Performance Information
  # Note: vSAN File Services does NOT support performance tuning via SPBM policies.
  # File shares use the underlying vSAN datastore's configuration.
  # IOPS limits, disk stripes, and RAID type are NOT configurable for file volumes.

---
