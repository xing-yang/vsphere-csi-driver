# Example StorageClassProperties CR showing all available properties
apiVersion: cns.vmware.com/v1alpha1
kind: StorageClassProperties
metadata:
  name: premium-vsan-esa-sc
spec:
  kind: StorageClass
  storageClassName: premium-vsan-esa-sc
  storagePolicyID: "aa6d5a82-1c88-45da-85d3-3d74b91a5bad"
status:
  # Storage Type Information
  storageTypeInfo:
    datastoreType: vsan
    vsanArchitecture: ESA
    vsanVersion: "9.1"

  # Volume Type Information
  volumeTypeInfo:
    supportedAccessModes:
      - ReadWriteOnce
      - ReadWriteMany
      - ReadOnlyMany
    supportedVolumeModes:
      - filesystem
      - block
    fileSystemTypes:
      - ext4
      - xfs
      - ntfs
    blockSupport: true

  # Topology Information
  topologyInfo:
    topologyType: crosszonal
    accessibleZones:
      - zone-1
      - zone-2
      - zone-3
    backingZones:
      - zone-1
      - zone-2
      - zone-3

  # Encryption Information
  encryptionInfo:
    supported: true
    types:
      - vm-crypt
      - vsan-encryption
    requiresKeyProvider: true

  # Performance Information
  performanceInfo:
    iopsLimit: 10000
    diskStripes: 1
    raidType: "RAID-5"
    storageTier: all-flash

---
