      - ReadWriteOnce
      - ReadWriteMany
      - ReadOnlyMany
    supportedVolumeModes:
      - filesystem
      - block
    fileSystemTypes:
      - ext4
      - xfs
      - ntfs
    blockSupport: true

  # Topology Information
  topologyInfo:
    topologyType: crosszonal
    accessibleZones:
      - zone-1
      - zone-2
      - zone-3
    backingZones:
      - zone-1
      - zone-2
      - zone-3

  # Encryption Information
  encryptionInfo:
